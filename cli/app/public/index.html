<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批次生图控制台</title>
<style>
  :root{
    --bg:#f7f6f4; --panel:#fff; --line:#e4e1dc; --line2:#d2cec7;
    --text:#1c1917; --muted:#78716c; --faint:#a8a29e;
    --blue:#185fa5; --blue-bg:#e6f1fb;
    --green:#3b6d11; --green-bg:#eaf3de;
    --red:#a32d2d; --red-bg:#fcebeb;
    --amber:#854f0b; --amber-bg:#faeeda;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text);padding:6px 12px}
  button:hover{background:#fafaf9}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.primary:hover{background:#0c447c}
  button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  input{font:inherit;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;width:62px;text-align:center;background:#fff;color:var(--text)}
  header{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:20}
  .logo{font-weight:600;font-size:14px}
  .src{color:var(--faint);font-size:11px;font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
  .spacer{flex:1}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
  .dot.busy{background:var(--amber)}
  .dot.off{background:var(--faint)}
  main{display:flex;height:calc(100vh - 52px)}
  aside{width:250px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;flex-shrink:0}
  .side-h{padding:12px 14px 6px;font-size:11px;color:var(--faint);letter-spacing:.04em}
  .b-item{padding:10px 14px;border-bottom:1px solid #f5f4f2;cursor:pointer}
  .b-item:hover{background:#faf9f7}
  .b-item.on{background:var(--blue-bg);border-left:3px solid var(--blue);padding-left:11px}
  .b-name{font-weight:500;font-size:13px;margin-bottom:2px}
  .b-meta{color:var(--muted);font-size:11px}
  section{flex:1;overflow:auto;padding:16px 18px 60px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .head h1{font-size:15px;font-weight:600;margin:0}
  .stats{display:flex;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .stats b{color:var(--text);font-weight:500}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .lbl{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{text-align:left;font-weight:500;font-size:11px;color:var(--muted);padding:8px 10px;background:#faf9f7;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #f5f4f2;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.row:hover{background:#fcfbfa}
  .thumb{width:72px;height:41px;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block;background:#f1efe8;cursor:zoom-in}
  .nopic{width:72px;height:41px;border-radius:5px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:10px}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;margin:1px 3px 1px 0;background:#f1efe8;color:#5f5e5a;white-space:nowrap}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;white-space:nowrap}
  .b-pass{background:var(--green-bg);color:var(--green)}
  .b-fail{background:var(--red-bg);color:var(--red)}
  .b-unsure,.b-wait{background:var(--amber-bg);color:var(--amber)}
  .b-pending{background:#f1efe8;color:#78716c}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .sim{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .sim.over{color:var(--red);font-weight:600}
  .regen{background:var(--red-bg);border:1px solid #f7c1c1;border-radius:8px;padding:10px 12px;margin-bottom:12px;color:#501313;font-size:12px}
  .regen b{color:var(--red)}
  #log{position:fixed;left:0;right:0;bottom:0;background:#1c1917;color:#e7e5e4;font:11px/1.55 ui-monospace,Consolas,monospace;max-height:30vh;overflow:auto;display:none;padding:8px 14px;z-index:30}
  #log.on{display:block}
  #log div{white-space:pre-wrap;word-break:break-all}
  .modal{position:fixed;inset:0;background:rgba(28,25,23,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .modal.on{display:flex}
  .modal img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
  .empty{color:var(--faint);padding:40px 0;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card img{width:100%;height:100px;object-fit:cover;display:block;background:#f1efe8;cursor:zoom-in}
  .card .c-body{padding:7px 9px;font-size:11px;color:var(--muted);height:54px;overflow:hidden}
  .tabs{display:flex;gap:4px}
  .tabs button{border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;border-radius:0;padding:6px 10px}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="logo">批次生图控制台</div>
  <div class="tabs">
    <button id="tabBatch" class="on">批次</button>
    <button id="tabLib">图库（客户端）</button>
  </div>
  <div class="src" id="srcPath">…</div>
  <div class="spacer"></div>
  <div id="jobState" style="color:var(--muted);font-size:12px"><span class="dot"></span><span id="jobText">就绪</span></div>
  <button class="ghost" id="btnLog">日志</button>
  <button id="btnStop">停止服务</button>
</header>

<main>
  <aside id="side"><div class="side-h">批次</div><div id="batchList"></div></aside>
  <section id="main">
    <div class="empty">先在左边选一个批次</div>
  </section>
</main>

<div id="log"></div>
<div class="modal" id="modal"><img id="modalImg" alt=""></div>

<script>
const $ = (s) => document.querySelector(s);
let state = { batches: [], job: null };
let curId = null;
let cur = null;
let libLoaded = false;
let view = 'batch';

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(n){ return (Number(n)||0).toFixed(3); }

async function api(url, opt){
  const r = await fetch(url, opt);
  const t = await r.text();
  try { return JSON.parse(t); } catch { return { error: t }; }
}
const post = (url, body) => api(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });

function batchOf(id){ return state.batches.find(b => b.id === id); }

function renderSide(){
  const box = $('#batchList');
  if (!state.batches.length){ box.innerHTML = '<div class="empty" style="padding:24px 14px">batches 目录为空<br>先解析提示词生成批次</div>'; return; }
  box.innerHTML = state.batches.map(b => `
    <div class="b-item ${b.id===curId?'on':''}" data-id="${esc(b.id)}">
      <div class="b-name">${esc(b.id)}</div>
      <div class="b-meta">${b.rows} 条 · 出图 ${b.generated} · 已检 ${b.checked}${b.failed?` · 失败 ${b.failed}`:''}</div>
    </div>`).join('');
  box.querySelectorAll('.b-item').forEach(el => el.onclick = () => selectBatch(el.dataset.id));
}

function badgeQc(q){
  if (!q) return '<span class="badge b-pending">未检</span>';
  if (q.verdict === 'pass') return '<span class="badge b-pass">过</span>';
  if (q.verdict === 'fail') return '<span class="badge b-fail">不过</span>';
  if (q.verdict === 'unsure') return '<span class="badge b-unsure">待人工</span>';
  return '<span class="badge b-fail">出错</span>';
}
function badgeStatus(s){
  if (s === 'ok') return '<span class="badge b-pass">已出图</span>';
  if (s === 'failed') return '<span class="badge b-fail">失败</span>';
  return '<span class="badge b-pending">待出</span>';
}

function renderMain(){
  if (view === 'lib') return renderLib();
  if (!cur){ $('#main').innerHTML = '<div class="empty">先在左边选一个批次</div>'; return; }
  const b = batchOf(cur.id) || {};
  const items = cur.items || [];
  const checked = items.filter(i => i.qc).length;
  const failed = items.filter(i => i.qc && i.qc.verdict === 'fail').length;
  const regen = cur.sim?.regen || [];

  const rows = items.map(it => {
    const img = it.file ? `<img class="thumb" src="/img?id=${encodeURIComponent(cur.id)}&p=${encodeURIComponent(it.file)}" onclick="zoom(this.src)">` : '<div class="nopic">无</div>';
    const tags = [it.tag1,it.tag2,it.tag3].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const sim = it.sim ? `<span class="sim ${it.sim.max>cur.hi?'over':''}">${pct(it.sim.max)}</span>` : '<span style="color:var(--faint)">—</span>';
    const qcTitle = it.qc?.reason ? ` title="${esc(it.qc.reason)}"` : '';
    return `<tr class="row">
      <td class="mono">${it.seq}</td>
      <td>${img}</td>
      <td>${esc(it.main_title||'—')}</td>
      <td>${tags||'<span style="color:var(--faint)">—</span>'}</td>
      <td>${badgeStatus(it.status)}</td>
      <td${qcTitle}>${badgeQc(it.qc)}</td>
      <td>${sim}</td>
      <td style="color:var(--muted);font-size:11px">${esc(it.tone||'')}<br>${esc(it.layout?('文字区'+it.layout):'')}</td>
    </tr>`;
  }).join('');

  const regenHtml = regen.length ? `<div class="regen"><b>有 ${regen.length} 张需要重出</b>（相似度超 ${cur.hi}）：` +
    regen.map(r => `${esc(r.regen)} 与 ${esc(r.keep)} 撞车 ${r.sim}`).join('；') + `</div>` : '';

  $('#main').innerHTML = `
    <div class="head">
      <h1>${esc(cur.id)}</h1>
      <div class="stats">
        <span>共 <b>${items.length}</b> 条</span>
        <span>已出图 <b>${items.filter(i=>i.status==='ok').length}</b></span>
        <span>已质检 <b>${checked}</b></span>
        <span>不合格 <b>${failed}</b></span>
        ${cur.sim ? `<span>相似度超线 <b style="color:var(--red)">${cur.sim.over_pairs}</b> 对</span>` : ''}
      </div>
    </div>
    ${regenHtml}
    <div class="toolbar">
      <span class="lbl">出图条数</span><input id="inLimit" type="number" value="${items.length}" min="1" max="${items.length}">
      <span class="lbl">并发</span><input id="inConc" type="number" value="4" min="1" max="15">
      <button class="primary" id="btnRun">开始出图</button>
      <button id="btnQc">批量质检</button>
      <button id="btnSim">算相似度</button>
      <span class="lbl" style="margin-left:6px">判定线 ${cur.hi}</span>
    </div>
    <table>
      <thead><tr><th>#</th><th>图</th><th>主标题</th><th>标签</th><th>出图</th><th>质检</th><th>最像</th><th>版式/色调</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">这批还没有数据</td></tr>'}</tbody>
    </table>`;

  $('#btnRun').onclick = () => doRun();
  $('#btnQc').onclick = () => doQc();
  $('#btnSim').onclick = () => doSim();
}

async function renderLib(){
  if (!libLoaded){
    $('#main').innerHTML = '<div class="empty">正在读取客户端数据库…</div>';
    const r = await api('/api/library');
    libLoaded = r;
  }
  const r = libLoaded;
  if (!r.ok){ $('#main').innerHTML = `<div class="empty">读不到客户端库：${esc(r.error)}</div>`; return; }
  $('#main').innerHTML = `
    <div class="head"><h1>客户端图库</h1>
      <div class="stats"><span>直接读 <b>${esc(r.db)}</b></span><span>最近 <b>${r.items.length}</b> 条任务</span></div>
    </div>
    <div class="grid">${r.items.map(it => `
      <div class="card">
        ${it.cover ? `<img src="/clientimg?p=${encodeURIComponent(it.cover)}" onclick="zoom(this.src)" onerror="this.style.display='none'">` : '<div style="height:100px;background:#f1efe8"></div>'}
        <div class="c-body">${esc(it.prompt||'(无提示词)')}<br><span style="color:var(--faint)">${it.images} 张 · ${esc(it.status)}</span></div>
      </div>`).join('')}</div>`;
  if (!r.items.length) $('#main').innerHTML += '<div class="empty">客户端里还没有任务</div>';
}

async function selectBatch(id){
  curId = id; view = 'batch';
  $('#tabBatch').classList.add('on'); $('#tabLib').classList.remove('on');
  cur = await api('/api/batch?id=' + encodeURIComponent(id));
  renderSide(); renderMain();
}

async function doRun(){
  const b = batchOf(curId) || {};
  const limit = Number($('#inLimit').value) || b.rows;
  const concurrency = Number($('#inConc').value) || 4;
  const r = await post('/api/run', { id: curId, limit, concurrency });
  if (r.error) return alert(r.error);
  $('#log').classList.add('on');
  poll();
}
async function doQc(){
  const r = await post('/api/qc', { id: curId });
  if (r.error) return alert(r.error);
  $('#log').classList.add('on');
  poll();
}
async function doSim(){
  const r = await post('/api/sim', { id: curId });
  if (r.error) return alert(r.error);
  $('#log').classList.add('on');
  poll();
}

function renderJob(j){
  const dot = $('#jobState .dot');
  const t = $('#jobText');
  if (!j){ dot.className='dot'; t.textContent='就绪'; return; }
  if (j.status === 'running'){ dot.className='dot busy'; t.textContent = j.kind + '中…'; }
  else { dot.className='dot'; t.textContent = (j.kind||'任务') + (j.status==='done'?'完成':'失败'); }
  const box = $('#log');
  const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = (j.log||[]).map(l => `<div>${esc(l)}</div>`).join('');
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

let lastJobStatus = null;
async function poll(){
  try{
    state = await api('/api/state');
    $('#srcPath').textContent = state.root || '';
    renderSide();
    renderJob(state.job);
    const st = state.job?.status;
    if (lastJobStatus === 'running' && (st === 'done' || st === 'failed')){
      if (curId) { cur = await api('/api/batch?id=' + encodeURIComponent(curId)); libLoaded=false; renderMain(); }
    }
    lastJobStatus = st;
  }catch(e){ $('#jobText').textContent = '服务已断开'; $('#jobState .dot').className='dot off'; }
  setTimeout(poll, 1500);
}

function zoom(src){ $('#modalImg').src = src; $('#modal').classList.add('on'); }
$('#modal').onclick = () => $('#modal').classList.remove('on');
$('#btnLog').onclick = () => $('#log').classList.toggle('on');
$('#tabBatch').onclick = () => { view='batch'; $('#tabBatch').classList.add('on'); $('#tabLib').classList.remove('on'); renderMain(); };
$('#tabLib').onclick = () => { view='lib'; $('#tabLib').classList.add('on'); $('#tabBatch').classList.remove('on'); renderLib(); };
$('#btnStop').onclick = async () => {
  if (!confirm('停止后本页面就断了，需要重新双击启动.bat')) return;
  await post('/api/stop');
  document.body.innerHTML = '<div style="padding:60px;text-align:center;font:14px system-ui;color:#78716c">服务已停止，可以关掉这个页面了。</div>';
};
poll();
</script>
</body>
</html>
