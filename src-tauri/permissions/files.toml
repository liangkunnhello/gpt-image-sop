[[permission]]
identifier = "files"
description = "允许主窗口弹出保存对话框、目录选择框或单次目录选择（用于配置交付地址）并分块写入用户所选的位置，登记用户此前配置过的交付地址用于自动交付（同名文件夹可复用、同名文件可覆盖），打开交付地址所在目录，读取、更改（仅经目录选择框）、使用和打开默认保存地址，并在更改后把原地址中的内容迁移到新地址"
commands.allow = [
  "save_file",
  "save_dir_pick",
  "save_dir_use",
  "pick_directory",
  "open_directory",
  "save_dir_folder",
  "save_dir_begin",
  "save_write",
  "save_commit",
  "save_abort",
  "download_dir_get",
  "download_dir_pick",
  "download_dir_use",
  "download_dir_open",
  "download_dir_migrate",
]
